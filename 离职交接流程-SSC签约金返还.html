<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离职交接流程 · SSC签约金返还</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px clamp(32px, 4.5vw, 96px); background: #fafafa; color: #152638; font: 14px Arial, "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid #276697; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .page { max-width: 1600px; margin: 0 auto; border: 1px solid #ddd; background: #fff; }
    .page-title { margin: 0; padding: 24px 0 28px; text-align: center; color: #aa4b35; font-size: 20px; line-height: 1.4; }
    .tabs { padding-left: 48px; border-bottom: 1px solid #d5d5d5; }
    .tab { display: inline-block; min-width: 136px; padding: 9px 20px; border-radius: 2px 2px 0 0; background: #cbe8d8; text-align: center; font-weight: 700; }
    .content { padding: 0 48px 30px; }
    .process-meta { display: flex; justify-content: space-between; gap: 20px; padding: 28px 4% 30px; }
    .process-meta p { margin: 0; }
    .process-meta p:last-child { margin-right: 5%; }
    .process-meta strong, .field > label { color: #555; font-weight: 700; }
    .section { margin-bottom: 18px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0; padding: 0 0 9px; border-bottom: 1px solid #d3d3d3; color: #000; font-size: 15px; line-height: 1.4; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; padding: 18px 5% 14px 4%; }
    .field { display: grid; grid-template-columns: 126px minmax(0, 1fr); align-items: center; gap: 10px; min-height: 32px; }
    .field.right-field { justify-self: end; width: 100%; max-width: 356px; }
    .field > label { text-align: right; white-space: nowrap; }
    .field input, .field select { width: 220px; max-width: 100%; min-width: 0; height: 32px; padding: 5px 6px; border: 1px solid #d7d7d7; border-radius: 3px; color: #152638; background: #fff; }
    .field input[readonly] { color: #7b8490; }
    .field input.amount-display { background: #ededed; color: #707070; }
    .field select:disabled { color: #707070; background: #fff; opacity: 1; }
    .field select { padding-right: 28px; }
    .field.full { grid-column: 1 / -1; }
    #departments { width: 100%; }
    .section-body { padding: 18px 4% 3px; }
    .section-body p { margin: 0; line-height: 1.35; }
    .check-list { display: grid; gap: 8px; padding: 20px 4% 0; }
    .check-label { display: flex; align-items: center; gap: 5px; line-height: 1.3; }
    .check-label input { margin: 0; width: 16px; height: 16px; accent-color: #568b73; }
    .legal .fields { padding-top: 18px; padding-bottom: 0; }
    .security .fields { padding-top: 18px; padding-bottom: 0; }
    .ssc .section-title { padding-top: 4px; }
    .ssc-note { margin: 16px 4%; color: #8b571e; font-size: 13px; line-height: 1.5; }
    .ssc-fields { padding-top: 0; padding-bottom: 0; }
    .ssc-fields .field { grid-template-columns: 170px minmax(0, 1fr); }
    .required { color: #b22e2e; margin-right: 4px; }
    .money-control { display: flex; align-items: center; gap: 10px; }
    .money-control input { width: 220px; }
    .money-control span { color: #555; }
    .field input[aria-invalid="true"] { border-color: #ba3636; }
    .amount-error, .action-feedback { grid-column: 2; margin: 0; font-size: 12px; line-height: 1.5; }
    .amount-error { color: #b22e2e; }
    .action-feedback { color: #51735f; }
    .finance, .card-handover, .loan-handover { margin-top: 30px; margin-bottom: 30px; }
    .finance .field, .card-handover .field, .loan-handover .field { grid-template-columns: 170px minmax(0, 1fr); }
    .finance .right-field, .card-handover .right-field { max-width: 400px; }
    .field.row-right { grid-column: 2; }
    #finance-return .fields { padding-top: 0; }
    .approval-panel { margin: 60px 4% 0; padding: 24px; border: 1px solid #ccc; }
    .approval-panel summary { cursor: pointer; color: #a75a12; font-weight: 700; line-height: 1.5; }
    .approval-panel summary::marker { color: #666; }
    .approval-panel textarea { display: block; width: 100%; min-height: 96px; margin-top: 10px; padding: 10px; border: 1px solid #bcbcbc; border-radius: 2px; color: #152638; background: #fff; box-shadow: inset 0 1px 4px rgb(0 0 0 / 8%); resize: vertical; }
    .approval-actions { display: flex; align-items: center; justify-content: flex-end; gap: 16px; margin-top: 38px; padding-right: 10%; }
    .approve-button { min-width: 82px; padding: 7px 22px; border: 1px solid #86b6d9; border-radius: 4px; color: #fff; background: linear-gradient(#73bcf0, #2d89c7); box-shadow: 0 1px 2px rgb(0 0 0 / 20%); font-weight: 700; }
    .approve-button:disabled { cursor: default; opacity: .55; }
    .approval-feedback { margin: 0; font-size: 12px; line-height: 1.5; color: #51735f; }
    .approval-feedback.error { color: #b22e2e; }
    @media (max-width: 1000px) {
      body { padding: 20px 32px; }
      .tabs { padding-left: 32px; }
      .content { padding-left: 32px; padding-right: 32px; }
      .fields { padding-left: 2%; padding-right: 2%; gap: 18px 20px; }
      .field { grid-template-columns: 126px minmax(0, 1fr); gap: 8px; }
      .field.right-field { max-width: none; }
      .process-meta { padding: 28px 20px; }
      .process-meta p:last-child { margin-right: 0; }
      .ssc-fields .field, .finance .field { grid-template-columns: 170px minmax(0, 1fr); }
      .ssc-note { margin-left: 22px; margin-right: 22px; }
      .section-body { padding-left: 22px; padding-right: 22px; }
      .check-list { padding-left: 30px; }
    }
    @media (max-width: 700px) {
      body { padding: 12px; font-size: 13px; }
      .page-title { padding: 20px 0 24px; font-size: 18px; }
      .tabs { padding-left: 18px; }
      .tab { min-width: 135px; }
      .content { padding-left: 18px; padding-right: 18px; }
      .process-meta { padding: 24px 4px 28px; gap: 12px; }
      .section-title { font-size: 14px; }
      .fields { grid-template-columns: 1fr; padding-left: 0; padding-right: 0; gap: 14px; }
      .field, .ssc-fields .field, .finance .field, .card-handover .field, .loan-handover .field { grid-template-columns: 132px minmax(0, 1fr); gap: 6px; }
      .finance .right-field, .card-handover .right-field { max-width: none; }
      .field.row-right { grid-column: auto; }
      .field input, .field select { width: 100%; font-size: 13px; }
      .section-body { padding: 18px 10px 0; }
      .check-list { padding: 22px 18px 0; }
      .ssc-note { margin: 16px 10px; font-size: 13px; }
      .ssc-fields { padding-top: 0; }
      .money-control { gap: 6px; }
      .money-control input { flex: 1; width: 100%; }
      .approval-panel { margin: 32px 0 0; padding: 16px; }
      .approval-actions { flex-wrap: wrap; margin-top: 24px; padding-right: 0; }
      .approval-feedback { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="page-title">交接提交</h1>
    <div class="tabs"><span class="tab">离职交接单</span></div>
    <div class="content">
      <div class="process-meta">
        <p><strong>流程编号：</strong> <span id="flow-id">12345</span></p>
        <p><strong>审批状态：</strong> <span id="approval-status">已保存</span></p>
      </div>
      <section class="section" aria-labelledby="personal-title">
        <h2 class="section-title" id="personal-title">个人信息</h2>
        <div class="fields">
          <div class="field"><label for="employee-name">姓名：</label><input id="employee-name" value="xxx" readonly></div>
          <div class="field right-field"><label for="employee-id">员工ID：</label><input id="employee-id" value="128889" readonly></div>
          <div class="field"><label for="departure-date">预计离职日期：</label><input id="departure-date" readonly></div>
          <div class="field right-field"><label for="direct-department">直属部门：</label><input id="direct-department" readonly></div>
          <div class="field full"><label for="departments">各级部门：</label><input id="departments" value="二级>三级>...>末级部门" readonly></div>
          <div class="field"><label for="desk-number">工位号码：</label><input id="desk-number" readonly></div>
          <div class="field right-field"><label for="handover-person">工作交接人：</label><input id="handover-person" value="xxx" readonly></div>
        </div>
      </section>
      <section class="section" aria-labelledby="employee-information-title">
        <h2 class="section-title" id="employee-information-title">员工相关信息</h2>
        <div class="section-body"><p>相关信息查询</p><p>说明:点击链接进入系统查询离职员工的相关信息</p></div>
      </section>
      <section class="section" aria-labelledby="department-title">
        <h2 class="section-title" id="department-title">部门内交接</h2>
        <div class="check-list">
          <label class="check-label"><input id="work-handover" type="checkbox" disabled>已完成工作交接</label>
          <label class="check-label"><input id="manager-confirmation" type="checkbox" disabled>上级确认交接情况</label>
        </div>
      </section>
      <section class="section ssc" id="ssc-handover" aria-labelledby="ssc-title">
        <h2 class="section-title" id="ssc-title">SSC交接</h2>
        <p class="ssc-note" id="ssc-note">该员工需返还签约金。</p>
        <form id="ssc-form" novalidate>
          <div class="fields ssc-fields">
            <div class="field full">
              <label for="signing-bonus-return-amount"><span class="required" aria-hidden="true">*</span>签约金返还金额：</label>
              <div class="money-control"><input id="signing-bonus-return-amount" name="signingBonusReturnAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="请输入返还金额" required aria-describedby="amount-error"><span>元</span></div>
              <p class="amount-error" id="amount-error" role="alert" hidden></p>
              <p class="action-feedback" id="ssc-feedback" role="status" aria-live="polite" hidden></p>
            </div>
          </div>
        </form>
      </section>
      <section class="section legal" aria-labelledby="legal-title">
        <h2 class="section-title" id="legal-title">法务</h2>
        <div class="fields"><div class="field"><label for="contract-archive">合同归档：</label><select id="contract-archive" disabled><option>已归档</option></select></div></div>
      </section>
      <section class="section security" aria-labelledby="security-title">
        <h2 class="section-title" id="security-title">信息安全</h2>
        <div class="fields">
          <div class="field"><label for="security-token">安全令牌：</label><select id="security-token" disabled><option>已归还</option></select></div>
          <div class="field right-field"><label for="other-security">其他：</label><select id="other-security" disabled><option>已归还</option></select></div>
        </div>
      </section>
      <section class="section finance" aria-labelledby="finance-title">
        <h2 class="section-title" id="finance-title">财务-报销与欠款</h2>
        <div class="fields">
          <div class="field"><label for="expense-reimbursement">费用报销：</label><select id="expense-reimbursement" data-finance-field><option value=""></option><option value="completed">已完成报销</option><option value="none">无待报销事项</option><option value="pending">未完成报销</option></select></div>
          <div class="field right-field"><label for="debt-repayment">欠款偿还：</label><select id="debt-repayment" data-finance-field><option value=""></option><option value="repaid">已偿还</option><option value="none">无欠款</option><option value="pending">未偿还</option></select></div>
          <div class="field"><label for="finance-process-handover">流程交接：</label><select id="finance-process-handover" data-finance-field><option value=""></option><option value="completed">已交接</option><option value="none">无需交接</option><option value="pending">未交接</option></select></div>
          <div class="field right-field"><label for="social-security-prepayment">社保预缴：</label><select id="social-security-prepayment" data-finance-field><option value=""></option><option value="paid">已缴清</option><option value="none">无需预缴</option><option value="pending">未缴清</option></select></div>
          <div class="field right-field row-right"><label for="social-security-debt">社保欠款合计：</label><input class="amount-display" id="social-security-debt" value="8000.00" readonly></div>
        </div>
        <div id="finance-return">
          <div class="fields">
            <div class="field"><label for="finance-return-amount">签约金返还金额：</label><div class="money-control"><input class="amount-display" id="finance-return-amount" readonly><span>元</span></div></div>
            <div class="field right-field"><label for="finance-return-status"><span class="required" aria-hidden="true">*</span>签约金返还确认：</label><select id="finance-return-status"><option value="" disabled hidden>请选择</option><option value="returned">已返还</option></select></div>
          </div>
        </div>
      </section>
      <section class="section card-handover" aria-labelledby="card-title">
        <h2 class="section-title" id="card-title">财务-一卡通</h2>
        <div class="fields">
          <div class="field"><label for="card-withdrawal">一卡通提现：</label><select id="card-withdrawal" data-finance-field><option value=""></option><option value="withdrawn">已提现</option><option value="none">无需提现</option><option value="pending">未提现</option></select></div>
          <div class="field right-field"><label for="card-balance">一卡通余额：</label><input class="amount-display" id="card-balance" value="0.00" readonly></div>
          <div class="field"><label for="withdrawal-date">取现日期：</label><input id="withdrawal-date" type="date" data-finance-field></div>
        </div>
      </section>
      <section class="section loan-handover" aria-labelledby="loan-title">
        <h2 class="section-title" id="loan-title">综合管理部-购房借款</h2>
        <div class="fields"><div class="field"><label for="housing-loan-principal">购房借款剩余本金：</label><select id="housing-loan-principal"><option value=""></option><option value="repaid">已还清</option><option value="none">无借款</option><option value="pending">未还清</option></select></div></div>
      </section>
      <div class="approval-panel">
        <details open>
          <summary id="approval-opinion-title">审批意见</summary>
          <textarea id="approval-opinion" aria-labelledby="approval-opinion-title"></textarea>
        </details>
        <div class="approval-actions">
          <p class="approval-feedback" id="approval-feedback" role="status" aria-live="polite" hidden></p>
          <button class="approve-button" id="approve-handover" type="button">通过</button>
        </div>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const amountInput = byId('signing-bonus-return-amount');
      const feedback = byId('ssc-feedback');
      const errorMessage = byId('amount-error');
      const financeConfirmation = byId('finance-return-status');
      const financeFields = [...document.querySelectorAll('[data-finance-field]')];
      // 原型展示需返还场景；是否需要返还和当前处理人角色由业务系统提供。
      let context = { flowId: '12345', employeeId: '128889', actorRole: 'ssc', requiresReturn: true };
      const emptyHandover = () => ({ status: 'pending', amount: '', financeConfirmation: '', financeApproved: false, approvalOpinion: '', housingLoanPrincipal: '', financeFields: {} });
      let handover = emptyHandover();
      let storageUnavailable = false;

      function storageKey() {
        return 'ssc-signing-bonus-handover:' + JSON.stringify([context.flowId, context.employeeId]);
      }

      function amountError(value) {
        if (!value) return '请录入签约金返还金额。';
        if (!/^\d+(\.\d{1,2})?$/.test(value)) return '请输入有效金额，最多保留两位小数。';
        const [integer, fraction = ''] = value.split('.');
        const cents = Number(integer) * 100 + Number(fraction.padEnd(2, '0'));
        if (!Number.isSafeInteger(cents)) return '金额过大，请核对后重新录入。';
        if (cents <= 0) return '需返还签约金时，返还金额必须大于 0。';
        return '';
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.hidden = !message;
        amountInput.setAttribute('aria-invalid', String(Boolean(message)));
        if (message) showFeedback('');
      }

      function showFeedback(message) {
        feedback.textContent = message;
        feedback.hidden = !message;
      }

      function loadHandover() {
        handover = emptyHandover();
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey()));
          if (saved && ['pending', 'draft', 'submitted'].includes(saved.status) && typeof saved.amount === 'string' && (!saved.amount || !amountError(saved.amount)) && (saved.status !== 'submitted' || saved.amount)) {
            handover = { ...emptyHandover(), status: saved.status, amount: saved.amount,
              financeConfirmation: saved.financeConfirmation === 'returned' ? 'returned' : '',
              financeApproved: saved.financeApproved === true && (!context.requiresReturn || saved.status === 'submitted' && saved.financeConfirmation === 'returned'),
              approvalOpinion: typeof saved.approvalOpinion === 'string' ? saved.approvalOpinion : '',
              housingLoanPrincipal: ['repaid', 'none', 'pending'].includes(saved.housingLoanPrincipal) ? saved.housingLoanPrincipal : '',
              financeFields: saved.financeFields && typeof saved.financeFields === 'object' ? saved.financeFields : {} };
          }
        } catch { storageUnavailable = true; }
        amountInput.value = handover.amount;
        financeConfirmation.value = handover.financeConfirmation;
        byId('approval-opinion').value = handover.approvalOpinion;
        byId('housing-loan-principal').value = handover.housingLoanPrincipal;
        for (const field of financeFields) field.value = typeof handover.financeFields[field.id] === 'string' ? handover.financeFields[field.id] : '';
      }

      function persist(nextHandover) {
        try {
          localStorage.setItem(storageKey(), JSON.stringify(nextHandover));
          storageUnavailable = false;
          return true;
        } catch {
          storageUnavailable = true;
          return false;
        }
      }

      function render() {
        const submitted = handover.status === 'submitted';
        const editable = context.requiresReturn && context.actorRole === 'ssc' && !submitted;
        amountInput.value = handover.amount;
        byId('flow-id').textContent = context.flowId;
        byId('employee-id').value = context.employeeId;
        byId('ssc-handover').hidden = !context.requiresReturn;
        byId('finance-return').hidden = !context.requiresReturn;
        amountInput.disabled = !context.requiresReturn;
        amountInput.required = context.requiresReturn;
        amountInput.readOnly = !editable;
        byId('ssc-note').textContent = submitted ? 'SSC 已提交签约金返还金额，请财务核对返还情况。' : '该员工需返还签约金。';
        byId('approval-status').textContent = context.requiresReturn && submitted || handover.financeApproved ? '交接中' : '已保存';
        byId('finance-return-amount').value = submitted ? handover.amount : '';
        financeConfirmation.required = context.requiresReturn;
        financeConfirmation.disabled = !context.requiresReturn || context.actorRole !== 'finance' || !submitted || handover.financeApproved;
        for (const field of financeFields) field.disabled = context.actorRole !== 'finance' || handover.financeApproved;
        const nodePassed = context.actorRole === 'ssc' ? submitted : context.actorRole === 'finance' ? handover.financeApproved : false;
        byId('approve-handover').disabled = nodePassed;
        byId('approval-opinion').readOnly = nodePassed;
      }

      function completeHandover(submit) {
        if (!context.requiresReturn || context.actorRole !== 'ssc' || handover.status === 'submitted') return false;
        const rawAmount = amountInput.value.trim();
        const error = rawAmount || submit ? amountError(rawAmount) : '';
        showError(error);
        if (error) { amountInput.focus(); return false; }
        const [integer, fraction = ''] = rawAmount.split('.');
        const amount = rawAmount ? String(Number(integer)) + '.' + fraction.padEnd(2, '0') : '';
        const nextHandover = { ...handover, amount, status: submit ? 'submitted' : 'draft', approvalOpinion: byId('approval-opinion').value, housingLoanPrincipal: byId('housing-loan-principal').value };
        if (!persist(nextHandover)) {
          showFeedback('当前浏览器无法保存，请允许本地存储后重试。');
          return false;
        }
        handover = nextHandover;
        amountInput.value = amount;
        render();
        showFeedback(submit ? 'SSC 交接已提交，返还金额已传至财务。' : '已保存，尚未提交 SSC 交接。');
        return true;
      }

      function approvalFeedback(message, isError = false) {
        const element = byId('approval-feedback');
        element.textContent = message;
        element.hidden = !message;
        element.classList.toggle('error', isError);
      }

      function approveHandover() {
        approvalFeedback('');
        if (context.actorRole === 'ssc' && context.requiresReturn) {
          if (completeHandover(true)) { showFeedback(''); approvalFeedback('SSC交接已通过。'); }
          return;
        }
        if (context.actorRole === 'finance') {
          if (handover.financeApproved) return;
          if (context.requiresReturn && handover.status !== 'submitted') { approvalFeedback('请先完成 SSC 交接。', true); return; }
          if (context.requiresReturn && financeConfirmation.value !== 'returned') { approvalFeedback('请核对签约金返还情况，确认已返还后通过。', true); financeConfirmation.focus(); return; }
          const nextHandover = { ...handover,
            financeConfirmation: context.requiresReturn ? financeConfirmation.value : '',
            financeApproved: true,
            approvalOpinion: byId('approval-opinion').value,
            housingLoanPrincipal: byId('housing-loan-principal').value,
            financeFields: Object.fromEntries(financeFields.map(field => [field.id, field.value])) };
          if (!persist(nextHandover)) { approvalFeedback('当前浏览器无法保存，请允许本地存储后重试。', true); return; }
          handover = nextHandover;
          render();
          approvalFeedback('财务交接已通过。');
          return;
        }
        approvalFeedback('当前交接内容已填写，审批由对应处理人办理。');
      }

      amountInput.addEventListener('input', () => { showError(''); showFeedback(''); });
      byId('ssc-form').addEventListener('submit', (event) => { event.preventDefault(); completeHandover(true); });
      byId('approve-handover').addEventListener('click', approveHandover);
      financeConfirmation.addEventListener('change', () => approvalFeedback(''));

      // 按流程编号和员工ID隔离草稿；正式接入时以服务端权限及流程状态为准。
      function setContext(data) {
        const next = { ...context, ...data };
        const identityChanged = String(next.flowId) !== context.flowId || String(next.employeeId) !== context.employeeId;
        const returnChanged = Boolean(next.requiresReturn) !== context.requiresReturn;
        context = { flowId: String(next.flowId), employeeId: String(next.employeeId), actorRole: String(next.actorRole).toLowerCase(), requiresReturn: Boolean(next.requiresReturn) };
        if (identityChanged || returnChanged) loadHandover();
        showError('');
        showFeedback(storageUnavailable ? '当前浏览器无法读取本地保存记录。' : '');
        approvalFeedback('');
        render();
      }

      window.departureHandoverPage = Object.freeze({
        setContext,
        // 由离职交接流程的统一保存、提交操作调用。
        save: () => completeHandover(false),
        submit: () => completeHandover(true),
        approve: approveHandover,
        setSigningBonus: (data) => setContext({ requiresReturn: Boolean(data.requiresReturn) }),
        getState: () => ({
          flowId: context.flowId,
          employeeId: context.employeeId,
          requiresReturn: context.requiresReturn,
          sscHandoverStatus: context.requiresReturn ? handover.status : 'skipped',
          signingBonusReturnAmount: context.requiresReturn ? handover.amount : null,
          financeReturnStatus: context.requiresReturn ? handover.financeApproved ? 'confirmed' : handover.status === 'submitted' ? 'pending' : 'waiting_for_ssc' : 'not_applicable'
        })
      });
      loadHandover();
      render();
    })();
  </script>
</body>
</html>
